# psarema-data: rebuilds ocean.json (build.mjs) three times a day and publishes it on GitHub Pages (branch gh-pages, one commit,
# force-pushed so the repo never grows). The push also counts as activity, so GitHub does not pause the schedule after 60 quiet days.
name: ocean
on:
  schedule: [{ cron: '15 5,13,21 * * *' }]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node build.mjs site
      - run: cp -r area3d sdb site/   # the 3D area packs (js/area3d.js) and the 20 m seabed tiles (js/sdb.js), downloaded on first use
      - run: |
          cd site && touch .nojekyll
          git init -q -b gh-pages && git add -A
          git -c user.name=psarema-data -c user.email=actions@users.noreply.github.com commit -q -m "ocean $(date -u '+%F %H:%M')"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
      # Round 15: the last 45 days' forecasts (ocean.json, currents.json; a folder per day, the day's last run wins) on branch `archive`, so the
      # errors by lead time can be measured against floats later (Psarema scripts/ocean/verify.mjs). One orphan commit, force-pushed: the repo
      # does not grow. It runs after the publish and cannot fail the job; an unreadable branch skips the step instead of starting it afresh.
      - name: archive
        continue-on-error: true
        run: |
          r="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" d=$(date -u +%F) s=0
          mkdir arc && cd arc && git init -q -b archive
          git ls-remote --exit-code "$r" refs/heads/archive > /dev/null || s=$?
          if [ $s = 0 ]; then git fetch -q --depth 1 "$r" archive && git checkout -q FETCH_HEAD -- .; elif [ $s != 2 ]; then exit 1; fi
          rm -rf "$d" && mkdir "$d" && cp ../site/ocean.json ../site/currents.json "$d"/
          ls -d 20??-??-?? | head -n -45 | xargs -r rm -rf
          git add -A && git -c user.name=psarema-data -c user.email=actions@users.noreply.github.com commit -q -m "forecasts to $d"
          git push -q -f "$r" HEAD:archive
